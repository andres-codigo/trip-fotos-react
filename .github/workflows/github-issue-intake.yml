name: GitHub - Issue Intake

on:
    issues:
        types: [opened, reopened, edited, labeled, unlabeled]
    workflow_dispatch:
        inputs:
            issue_number:
                description: 'Issue number to process'
                required: true
                type: string

permissions:
    contents: read
    issues: write
    repository-projects: write

concurrency:
    group: issue-intake-${{ github.event.issue.number || inputs.issue_number }}
    cancel-in-progress: false

jobs:
    intake-issue:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout label config
              uses: actions/checkout@v4
              with:
                  sparse-checkout: .github

            - name: Intake issue and sync its board status
              uses: actions/github-script@v9
              env:
                  PROJECT_ID: PVT_kwHOAybMeM4BCojE
                  PROJECT_STATUS_FIELD_ID: PVTSSF_lAHOAybMeM4BCojEzg0yW4g
                  STATUS_TRIAGE_OPTION_ID: 46daf40e
                  STATUS_BACKLOG_OPTION_ID: 7be623db
                  STATUS_READY_OPTION_ID: f75ad846
                  STATUS_IN_PROGRESS_OPTION_ID: 47fc9ee4
                  STATUS_BLOCKED_OPTION_ID: ba1ca20d
                  STATUS_IN_REVIEW_OPTION_ID: 5e639cc6
                  STATUS_DONE_OPTION_ID: 98236657
                  DEFAULT_ASSIGNEE: andres-codigo
                  PROJECT_AUTOMATION_TOKEN: ${{ secrets['PROJECT_AUTOMATION_TOKEN'] }}
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const owner = context.repo.owner
                      const repo = context.repo.repo

                      const PROJECT_ID = process.env.PROJECT_ID
                      const STATUS_FIELD_ID = process.env.PROJECT_STATUS_FIELD_ID
                      const STATUS = {
                        TRIAGE: process.env.STATUS_TRIAGE_OPTION_ID,
                        BACKLOG: process.env.STATUS_BACKLOG_OPTION_ID,
                        READY: process.env.STATUS_READY_OPTION_ID,
                        IN_PROGRESS: process.env.STATUS_IN_PROGRESS_OPTION_ID,
                        BLOCKED: process.env.STATUS_BLOCKED_OPTION_ID,
                        IN_REVIEW: process.env.STATUS_IN_REVIEW_OPTION_ID,
                        DONE: process.env.STATUS_DONE_OPTION_ID,
                      }
                      const { loadLabelConfig, statusLabel, typeFor } = await import(
                        `${process.env.GITHUB_WORKSPACE}/.github/scripts/labels.mjs`
                      )
                      const labelConfig = loadLabelConfig(process.env.GITHUB_WORKSPACE)
                      const READY_LABEL = statusLabel(labelConfig, 'ready')
                      const BLOCKED_LABEL = statusLabel(labelConfig, 'blocked')
                      const IN_PROGRESS_LABEL = statusLabel(labelConfig, 'inProgress')
                      const TYPE_LABELS = labelConfig.type.map((label) => label.name)
                      const DEFAULT_ASSIGNEE = process.env.DEFAULT_ASSIGNEE
                      const PROJECT_AUTOMATION_TOKEN = process.env.PROJECT_AUTOMATION_TOKEN || ''

                      const projectGithub = PROJECT_AUTOMATION_TOKEN
                        ? getOctokit(PROJECT_AUTOMATION_TOKEN)
                        : github

                      const projectGraphql = async (query, variables) => {
                        return projectGithub.graphql(query, variables)
                      }

                      const issueNumber = (() => {
                        if (context.eventName === 'workflow_dispatch') {
                          const parsed = Number(context.payload.inputs?.issue_number)
                          return Number.isNaN(parsed) ? null : parsed
                        }

                        return context.payload.issue?.number || null
                      })()

                      if (!issueNumber) {
                        core.setFailed('Unable to resolve issue number from event payload.')
                        return
                      }

                      const issueResponse = await github.rest.issues.get({
                        owner,
                        repo,
                        issue_number: issueNumber,
                      })

                      const issue = issueResponse.data

                      if (issue.pull_request) {
                        core.info(`Skipping #${issueNumber} because it is a pull request.`)
                        return
                      }

                      const existingLabelNames = (issue.labels || []).map((label) =>
                        typeof label === 'string' ? label : label.name,
                      )

                      // Only the title prefix is a reliable signal; areas come from the PR that closes the issue
                      const expectedType = typeFor(labelConfig, { title: issue.title })

                      const action = context.eventName === 'workflow_dispatch' ? 'dispatch' : context.payload.action
                      const isLabelEvent = action === 'labeled' || action === 'unlabeled'

                      // Labels added by a workflow are auto-labels, not a triage decision
                      if (isLabelEvent && context.payload.sender?.type === 'Bot') {
                        core.info(`Skipping ${action} event on #${issueNumber} from bot ${context.payload.sender.login}.`)
                        return
                      }

                      if (!isLabelEvent) {
                        if (expectedType) {
                          if (!existingLabelNames.includes(expectedType)) {
                            await github.rest.issues.addLabels({
                              owner,
                              repo,
                              issue_number: issueNumber,
                              labels: [expectedType],
                            })
                          }
                          // A retitled issue keeps a single type label
                          for (const name of existingLabelNames.filter((label) => TYPE_LABELS.includes(label) && label !== expectedType)) {
                            await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name })
                          }
                        }

                        if (DEFAULT_ASSIGNEE && !(issue.assignees || []).some((assignee) => assignee.login === DEFAULT_ASSIGNEE)) {
                          await github.rest.issues.addAssignees({
                            owner,
                            repo,
                            issue_number: issueNumber,
                            assignees: [DEFAULT_ASSIGNEE],
                          })
                        }
                      }

                      const addProjectItem = async (contentId) => {
                        const data = await projectGraphql(
                          `mutation($projectId: ID!, $contentId: ID!) {
                            addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                              item { id }
                            }
                          }`,
                          {
                            projectId: PROJECT_ID,
                            contentId,
                          },
                        )

                        return data?.addProjectV2ItemById?.item?.id || null
                      }

                      const getProjectItemIdByContentId = async (contentId) => {
                        let hasNextPage = true
                        let cursor = null

                        while (hasNextPage) {
                          const data = await projectGraphql(
                            `query($projectId: ID!, $cursor: String) {
                              node(id: $projectId) {
                                ... on ProjectV2 {
                                  items(first: 100, after: $cursor) {
                                    pageInfo {
                                      hasNextPage
                                      endCursor
                                    }
                                    nodes {
                                      id
                                      content {
                                        __typename
                                        ... on Issue { id }
                                      }
                                    }
                                  }
                                }
                              }
                            }`,
                            {
                              projectId: PROJECT_ID,
                              cursor,
                            },
                          )

                          const items = data?.node?.items?.nodes || []
                          const found = items.find((item) => item?.content?.id === contentId)
                          if (found?.id) return found.id

                          hasNextPage = data?.node?.items?.pageInfo?.hasNextPage || false
                          cursor = data?.node?.items?.pageInfo?.endCursor || null
                        }

                        return null
                      }

                      const ensureProjectItem = async (contentId) => {
                        let itemId = await getProjectItemIdByContentId(contentId)
                        if (!itemId) {
                          itemId = await addProjectItem(contentId)
                        }
                        return itemId
                      }

                      const setStatus = async (itemId, optionId) => {
                        await projectGraphql(
                          `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                            updateProjectV2ItemFieldValue(
                              input: {
                                projectId: $projectId
                                itemId: $itemId
                                fieldId: $fieldId
                                value: { singleSelectOptionId: $optionId }
                              }
                            ) {
                              projectV2Item { id }
                            }
                          }`,
                          {
                            projectId: PROJECT_ID,
                            itemId,
                            fieldId: STATUS_FIELD_ID,
                            optionId,
                          },
                        )
                      }

                      const getStatusOptionId = async (itemId) => {
                        const data = await projectGraphql(
                          `query($itemId: ID!) {
                            node(id: $itemId) {
                              ... on ProjectV2Item {
                                fieldValues(first: 50) {
                                  nodes {
                                    ... on ProjectV2ItemFieldSingleSelectValue {
                                      optionId
                                      field {
                                        ... on ProjectV2SingleSelectField {
                                          id
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }`,
                          {
                            itemId,
                          },
                        )

                        const values = data?.node?.fieldValues?.nodes || []
                        const statusEntry = values.find((entry) => entry?.field?.id === STATUS_FIELD_ID)
                        return statusEntry?.optionId || null
                      }

                      // Only "Closes #N"-style links are visible here; Tracking-Issue markers are handled by the lifecycle workflow
                      const getOpenLinkedPullRequests = async () => {
                        const data = await github.graphql(
                          `query($owner: String!, $repo: String!, $number: Int!) {
                            repository(owner: $owner, name: $repo) {
                              issue(number: $number) {
                                closedByPullRequestsReferences(first: 10, includeClosedPrs: false) {
                                  nodes { isDraft state }
                                }
                              }
                            }
                          }`,
                          {
                            owner,
                            repo,
                            number: issueNumber,
                          },
                        )

                        const nodes = data?.repository?.issue?.closedByPullRequestsReferences?.nodes || []
                        return nodes.filter((node) => node?.state === 'OPEN')
                      }

                      const resolveUnblockedStatus = async () => {
                        const openPullRequests = await getOpenLinkedPullRequests()
                        if (openPullRequests.some((pull) => !pull.isDraft)) return STATUS.IN_REVIEW
                        if (openPullRequests.length > 0) return STATUS.IN_PROGRESS
                        if (existingLabelNames.includes(IN_PROGRESS_LABEL)) return STATUS.IN_PROGRESS
                        if (existingLabelNames.includes(READY_LABEL)) return STATUS.READY
                        return STATUS.BACKLOG
                      }

                      const resolveNextStatus = async (currentStatus) => {
                        if (!isLabelEvent) {
                          if (!currentStatus) return STATUS.TRIAGE
                          if (action === 'reopened' && currentStatus === STATUS.DONE) return STATUS.BACKLOG
                          // Edits never move an issue that is already on the board (#290)
                          return null
                        }

                        const labelName = context.payload.label?.name
                        const isBlocked = existingLabelNames.includes(BLOCKED_LABEL)

                        if (action === 'labeled') {
                          if (labelName === BLOCKED_LABEL) return STATUS.BLOCKED
                          if (isBlocked) return null
                          // Triage is an inbox: an issue is assessed (Backlog) before it is queued or started
                          if ((labelName === READY_LABEL || labelName === IN_PROGRESS_LABEL) && currentStatus === STATUS.TRIAGE) {
                            await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: labelName })
                            await github.rest.issues.createComment({
                              owner,
                              repo,
                              issue_number: issueNumber,
                              body: `Removed \`${labelName}\`: this issue is still in Triage. Assess it first (add its area or type labels, which moves it to Backlog), then add \`${labelName}\`.`,
                            })
                            return null
                          }
                          if (labelName === READY_LABEL) {
                            return [null, STATUS.BACKLOG].includes(currentStatus) ? STATUS.READY : null
                          }
                          // Never pulls an issue back from In review or Done (#302)
                          if (labelName === IN_PROGRESS_LABEL) {
                            return [null, STATUS.BACKLOG, STATUS.READY].includes(currentStatus)
                              ? STATUS.IN_PROGRESS
                              : null
                          }
                          // Labels picked on the new-issue form arrive with the opened event; they are not a triage decision
                          const isJustCreated = Date.now() - new Date(issue.created_at).getTime() < 60_000
                          if (isJustCreated) return null
                          // Any later manual label counts as the issue having been triaged
                          return [null, STATUS.TRIAGE].includes(currentStatus) ? STATUS.BACKLOG : null
                        }

                        if (labelName === BLOCKED_LABEL) return resolveUnblockedStatus()
                        if (labelName === READY_LABEL && currentStatus === STATUS.READY) return STATUS.BACKLOG
                        if (labelName === IN_PROGRESS_LABEL && currentStatus === STATUS.IN_PROGRESS) return resolveUnblockedStatus()
                        return null
                      }

                      let projectItemId
                      let finalStatus
                      try {
                        projectItemId = await ensureProjectItem(issue.node_id)
                        if (!projectItemId) {
                          core.setFailed(`Unable to create or resolve project item for issue #${issueNumber}.`)
                          return
                        }

                        const currentStatus = await getStatusOptionId(projectItemId)
                        const nextStatus = await resolveNextStatus(currentStatus)
                        if (nextStatus && nextStatus !== currentStatus) {
                          await setStatus(projectItemId, nextStatus)
                          core.info(`Issue #${issueNumber} status: ${currentStatus || 'empty'} -> ${nextStatus}.`)
                        } else {
                          core.info(`Issue #${issueNumber} status left unchanged (${currentStatus || 'empty'}).`)
                        }

                        finalStatus = await getStatusOptionId(projectItemId)
                      } catch (error) {
                        core.setFailed(
                          `Project update failed for issue #${issueNumber}. Ensure PROJECT_AUTOMATION_TOKEN has project + repo scope. Error: ${error.message}`,
                        )
                        return
                      }

                      if (!finalStatus) {
                        core.setFailed(`Verification failed: issue #${issueNumber} has no project status.`)
                        return
                      }

                      if (isLabelEvent) return

                      const refreshedIssue = await github.rest.issues.get({
                        owner,
                        repo,
                        issue_number: issueNumber,
                      })

                      const refreshedLabels = (refreshedIssue.data.labels || []).map((label) =>
                        typeof label === 'string' ? label : label.name,
                      )

                      const hasAssignee = (refreshedIssue.data.assignees || []).some(
                        (assignee) => assignee.login === DEFAULT_ASSIGNEE,
                      )

                      if (expectedType && !refreshedLabels.includes(expectedType)) {
                        core.setFailed(`Verification failed: issue #${issueNumber} is missing its type label (${expectedType}).`)
                        return
                      }

                      if (!hasAssignee) {
                        core.setFailed(`Verification failed: issue #${issueNumber} is not assigned to ${DEFAULT_ASSIGNEE}.`)
                        return
                      }

                      core.info(`Issue #${issueNumber} intake succeeded: project item linked, status set, labels and assignee verified.`)
