name: GitHub - Issue Intake

on:
    issues:
        types: [opened, reopened, edited, labeled, unlabeled]
    workflow_dispatch:
        inputs:
            issue_number:
                description: 'Issue number to process'
                required: true
                type: string

permissions:
    contents: read
    issues: write
    repository-projects: write

concurrency:
    group: issue-intake-${{ github.event.issue.number || inputs.issue_number }}
    cancel-in-progress: false

jobs:
    intake-issue:
        # Labels added by a workflow are auto-labels, not a triage decision: skip them before a runner starts
        if: github.event_name == 'workflow_dispatch' || !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.sender.type == 'Bot')
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout label config
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  sparse-checkout: .github

            - name: Intake issue and sync its board status
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  DEFAULT_ASSIGNEE: andres-codigo
                  PROJECT_AUTOMATION_TOKEN: ${{ secrets['PROJECT_AUTOMATION_TOKEN'] }}
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/intake.mjs`)
                      await run({ github, context, core, getOctokit })
