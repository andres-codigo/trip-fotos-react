name: Cypress - Run E2E Page Tests
permissions:
    contents: read
    pull-requests: write

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'cypress/**'
            - 'cypress.config.*'
            - 'package.json'
    pull_request:
        branches:
            - main
        # Draft PRs wait for ready_for_review: /verify already ran the same gates locally
        types: [opened, synchronize, reopened, ready_for_review]
        # Only files the app, the emulators or the specs depend on
        paths:
            - 'src/**'
            - 'cypress/**'
            - 'cypress.config.js'
            - 'scripts/**'
            - 'firebase/**'
            - 'firebase.json'
            - '.env.emulators'
            - 'index.html'
            - 'public/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
            - '.github/workflows/cypress-e2e.yml'
            - '.github/actions/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    run-live-smoke-test:
        name: Run Cypress Live Smoke Test
        # Only the merged code meets the real project: PRs run the emulator job alone, which needs no secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Set up Node and install dependencies
              uses: ./.github/actions/setup-node

            - name: Start app & run the live smoke spec
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
                  VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
                  VITE_BACKEND_BASE_URL: ${{ secrets.VITE_BACKEND_BASE_URL }}
                  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
                  VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
                  CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
                  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
              with:
                  start: npm run dev
                  # The action's URL ping only retries a fixed list of error codes and failed at once on the runner (ISSUE#317 (wait-on retries))
                  wait-on: 'curl --silent --fail --output /dev/null --retry 30 --retry-delay 2 --retry-max-time 60 --retry-all-errors http://localhost:3000'
                  browser: chrome

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-live-screenshots
                  path: cypress/screenshots
                  retention-days: 7

    run-e2e-emulator-tests:
        name: E2E group ${{ matrix.group }} of 3 (Firebase emulators)
        # The PR run already passed these specs on the same code; pushes to main run only the live smoke test
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.head_ref, 'release-please--'))
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Each group runs its own emulators; scripts/e2e-groups.mjs balances the specs by recorded time. Every group finishes, so one failure does not hide another
        strategy:
            fail-fast: false
            matrix:
                group: [1, 2, 3]
        # No secrets are needed, so this runs on every PR, Dependabot's included
        env:
            CI: 'true'
            FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
            NO_UPDATE_NOTIFIER: '1'

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Java (Firebase emulators)
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Cache Firebase emulators and CLI
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.cache/firebase/emulators
                      ~/.npm/_npx
                  key: firebase-cli-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
                  restore-keys: firebase-cli-emulators-${{ runner.os }}-

            - name: Set up Node and install dependencies
              uses: ./.github/actions/setup-node

            - name: Run this group's E2E specs against the emulators
              run: |
                  E2E_SPEC="$(node scripts/e2e-groups.mjs ${{ matrix.group }} 3)"
                  echo "Specs: $E2E_SPEC"
                  E2E_SPEC="$E2E_SPEC" npm run cy:run:e2e:emulators

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-emulator-screenshots-group-${{ matrix.group }}
                  path: cypress/screenshots
                  retention-days: 7

            - name: Upload Cypress videos on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-emulator-videos-group-${{ matrix.group }}
                  path: cypress/videos
                  retention-days: 7

    # One check name whatever the number of groups, for a ruleset or a reader to rely on
    e2e-emulator-summary:
        name: Run Cypress E2E Tests (Firebase emulators)
        needs: run-e2e-emulator-tests
        if: always() && needs.run-e2e-emulator-tests.result != 'skipped'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check every E2E group passed
              run: test "${{ needs.run-e2e-emulator-tests.result }}" = success
