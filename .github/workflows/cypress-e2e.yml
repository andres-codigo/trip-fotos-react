name: Cypress - Run E2E Page Tests
permissions:
    contents: read
    pull-requests: write

on:
    push:
        branches:
            - main
        # The same paths as pull requests, so every merge that could affect a spec gets the full run
        paths: &e2e-paths
            - 'src/**'
            - 'cypress/**'
            - 'cypress.config.js'
            - 'scripts/**'
            - 'firebase/**'
            - 'firebase.json'
            - '.env.emulators'
            - 'index.html'
            - 'public/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
            - '.github/workflows/cypress-e2e.yml'
            - '.github/actions/**'
            - '.claude/skills/verify/run-e2e.mjs'
            - '.claude/skills/verify/spec-results.mjs'
    pull_request:
        branches:
            - main
        # Draft PRs wait for ready_for_review: /verify already ran the same gates locally
        types: [opened, synchronize, reopened, ready_for_review]
        # Only files the app, the emulators or the specs depend on
        paths: *e2e-paths
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # A newer push supersedes a PR run, but every merge to main keeps its full run
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    run-live-smoke-test:
        name: Run Cypress Live Smoke Test
        # Only the merged code meets the real project: PRs run the emulator job alone, which needs no secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Set up Node and install dependencies
              uses: ./.github/actions/setup-node

            - name: Start app & run the live smoke spec
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
                  VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
                  VITE_BACKEND_BASE_URL: ${{ secrets.VITE_BACKEND_BASE_URL }}
                  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
                  VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
                  CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
                  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
              with:
                  start: npm run dev
                  # The action's URL ping only retries a fixed list of error codes and failed at once on the runner (ISSUE#317 (wait-on retries))
                  wait-on: 'curl --silent --fail --output /dev/null --retry 30 --retry-delay 2 --retry-max-time 60 --retry-all-errors http://localhost:3000'
                  browser: chrome

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-live-screenshots
                  path: cypress/screenshots
                  retention-days: 7

    plan-e2e-emulator-tests:
        name: Plan the E2E groups
        # Release-please PRs change only the version and changelog; main ran the full suite after each merge they release
        if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release-please--'))
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            groups: ${{ steps.plan.outputs.groups }}

        steps:
            # A PR checks out its merge commit, whose first parent is main: the diff between them is the PR's change
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'

            # A PR runs only the specs cypress/impact.js maps its files to (all of them for shared files); main and manual runs run every spec
            - name: Pick the specs and split them into groups
              id: plan
              env:
                  EVENT: ${{ github.event_name }}
              run: |
                  if [ "$EVENT" = pull_request ]; then
                      git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"
                      node scripts/e2e-groups.mjs "$RUNNER_TEMP/changed-files.txt"
                  else
                      node scripts/e2e-groups.mjs
                  fi

    run-e2e-emulator-tests:
        name: E2E group ${{ matrix.group }} of ${{ matrix.count }} (Firebase emulators)
        needs: plan-e2e-emulator-tests
        if: needs.plan-e2e-emulator-tests.outputs.groups != '0'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Each group runs its own emulators; scripts/e2e-groups.mjs balances the specs by recorded time. Every group finishes, so one failure does not hide another
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan-e2e-emulator-tests.outputs.matrix) }}
        # No secrets are needed, so this runs on every PR, Dependabot's included
        env:
            CI: 'true'
            FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
            NO_UPDATE_NOTIFIER: '1'

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Java (Firebase emulators)
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Cache Firebase emulators and CLI
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.cache/firebase/emulators
                      ~/.npm/_npx
                  key: firebase-cli-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
                  restore-keys: firebase-cli-emulators-${{ runner.os }}-

            - name: Set up Node and install dependencies
              uses: ./.github/actions/setup-node

            - name: Run this group's E2E specs against the emulators
              env:
                  E2E_SPEC: ${{ matrix.specs }}
              run: npm run cy:run:e2e:emulators

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-emulator-screenshots-group-${{ matrix.group }}
                  path: cypress/screenshots
                  retention-days: 7

            - name: Upload Cypress videos on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-emulator-videos-group-${{ matrix.group }}
                  path: cypress/videos
                  retention-days: 7

    # One check name whatever the number of groups, for a ruleset or a reader to rely on
    e2e-emulator-summary:
        name: Run Cypress E2E Tests (Firebase emulators)
        needs: [plan-e2e-emulator-tests, run-e2e-emulator-tests]
        if: always() && needs.plan-e2e-emulator-tests.result != 'skipped'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # Skipped groups pass only when the plan ran and found no spec to run
            - name: Check every E2E group passed
              env:
                  PLAN: ${{ needs.plan-e2e-emulator-tests.result }}
                  GROUPS: ${{ needs.run-e2e-emulator-tests.result }}
                  EVENT: ${{ github.event_name }}
              run: |
                  if [ "$PLAN" = success ] && { [ "$GROUPS" = success ] || [ "$GROUPS" = skipped ]; }; then exit 0; fi
                  if [ "$EVENT" = push ]; then
                      message="The full E2E run on main failed after the merge of ${GITHUB_SHA::7} (plan: $PLAN, groups: $GROUPS). Fix main before the next release PR merges."
                  else
                      message="E2E failed (plan: $PLAN, groups: $GROUPS)."
                  fi
                  echo "::error::$message"
                  echo "$message" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
