name: Cypress - Run E2E Page Tests
permissions:
    contents: read
    pull-requests: write

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'cypress/**'
            - 'cypress.config.*'
            - 'package.json'
    pull_request:
        branches:
            - main
        # Docs and tooling-guidance changes cannot affect the app; workflow edits still run everything
        paths:
            - '**'
            - '!**/*.md'
            - '!.claude/**'
            - '!.devcontainer/**'
            - '!.vscode/**'
            - '!.github/**'
            - '.github/workflows/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    run-live-smoke-test:
        name: Run Cypress Live Smoke Test
        # Only the merged code meets the real project: PRs run the emulator job alone, which needs no secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Start app & run the live smoke spec
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
                  VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
                  VITE_BACKEND_BASE_URL: ${{ secrets.VITE_BACKEND_BASE_URL }}
                  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
                  VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
                  CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
                  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
              with:
                  start: npm run dev
                  # The action's URL ping only retries a fixed list of error codes and failed at once on the runner (ISSUE#317 (wait-on retries))
                  wait-on: 'curl --silent --fail --output /dev/null --retry 30 --retry-delay 2 --retry-max-time 60 --retry-all-errors http://localhost:3000'
                  browser: chrome

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-live-screenshots
                  path: cypress/screenshots
                  retention-days: 7

    run-e2e-emulator-tests:
        name: Run Cypress E2E Tests (Firebase emulators)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # No secrets are needed, so this runs on every PR, Dependabot's included
        env:
            CI: 'true'
            FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
            NO_UPDATE_NOTIFIER: '1'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Setup Java (Firebase emulators)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Cache Firebase emulators and CLI
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/firebase/emulators
                      ~/.npm/_npx
                  key: firebase-cli-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
                  restore-keys: firebase-cli-emulators-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Run Cypress E2E Page Tests against the emulators
              run: npm run cy:run:e2e:emulators

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-emulator-screenshots
                  path: cypress/screenshots
                  retention-days: 7

            - name: Upload Cypress videos on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-emulator-videos
                  path: cypress/videos
                  retention-days: 7
