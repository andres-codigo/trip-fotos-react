name: GitHub - Project Item Lifecycle

on:
    pull_request_target:
        types:
            [
                opened,
                reopened,
                edited,
                ready_for_review,
                converted_to_draft,
                closed,
            ]

permissions:
    contents: read
    issues: write
    pull-requests: write
    repository-projects: write

jobs:
    sync-project-lifecycle:
        # An edit that left the body alone cannot change which issues the PR closes
        if: github.event.action != 'edited' || github.event.changes.body != null
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout label config
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  sparse-checkout: .github

            - name: Sync issue and project lifecycle
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  # Optional PAT for Project v2 writes. Rotation/recreation guide:
                  # .github/project-automation-token.md
                  PROJECT_AUTOMATION_TOKEN: ${{ secrets['PROJECT_AUTOMATION_TOKEN'] }}
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/lifecycle.mjs`)
                      await run({ github, context, core, getOctokit })
