name: Cypress - Run Component Tests
permissions:
    contents: read
    pull-requests: write

on:
    pull_request:
        branches:
            - main
        # Draft PRs wait for ready_for_review: /verify already ran the same gates locally
        types: [opened, synchronize, reopened, ready_for_review]
        # Only files the component tests load; E2E specs and fixtures do not affect them
        paths:
            - 'src/**'
            - 'cypress.config.js'
            - 'cypress/support/**'
            - 'scripts/seed-emulators.mjs'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
            - '.github/workflows/cypress-component.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    run-component-tests:
        name: Run Cypress Component Tests
        if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release-please--'))
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # The suites never reach Firebase, so placeholders replace the real secrets (and Dependabot PRs can run them)
        env:
            VITE_FIREBASE_API_KEY: placeholder
            VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
            VITE_DATABASE_URL: https://placeholder-default-rtdb.firebaseio.com
            VITE_FIREBASE_PROJECT_ID: placeholder
            VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
            VITE_FIREBASE_MESSAGING_SENDER_ID: '1'
            VITE_FIREBASE_APP_ID: 1:1:web:placeholder

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            # The Cypress action installs the dependencies and caches the npm and Cypress downloads itself
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'

            - name: Run Cypress Component Tests
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              with:
                  component: true

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
                  retention-days: 7

            - name: Upload Cypress videos on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-videos
                  path: cypress/videos
                  retention-days: 7
