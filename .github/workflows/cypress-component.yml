name: Cypress - Run Component Tests
permissions:
    contents: read
    pull-requests: write

on:
    push:
        branches:
            - main
        paths:
            - 'src/**/*.cy.{js,jsx,ts,tsx}'
            - 'src/**/*.jsx'
            - 'src/**/*.tsx'
            - 'cypress.config.*'
            - 'package.json'
    pull_request:
        branches:
            - main
        # Docs and tooling-guidance changes cannot affect the app; workflow edits still run everything
        paths:
            - '**'
            - '!**/*.md'
            - '!.claude/**'
            - '!.devcontainer/**'
            - '!.vscode/**'
            - '!.github/**'
            - '.github/workflows/**'
    workflow_dispatch:

jobs:
    run-component-tests:
        name: Run Cypress Component Tests
        runs-on: ubuntu-latest
        env:
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run Cypress Component Tests
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              with:
                  component: true

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
                  retention-days: 7

            - name: Upload Cypress videos on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-videos
                  path: cypress/videos
                  retention-days: 7
