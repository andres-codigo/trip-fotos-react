name: Cypress - Run Component Tests
permissions:
    contents: read
    pull-requests: write

on:
    pull_request:
        branches:
            - main
        # Draft PRs wait for ready_for_review: /verify already ran the same gates locally
        types: [opened, synchronize, reopened, ready_for_review]
        # Only files the component tests load; E2E specs and fixtures do not affect them
        paths:
            - 'src/**'
            - 'cypress.config.js'
            - 'cypress/support/**'
            - 'scripts/seed-emulators.mjs'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
            - '.github/workflows/cypress-component.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    run-component-tests:
        name: Run Cypress Component Tests
        if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release-please--'))
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Cache Cypress binary
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: npm ci

            - name: Run Cypress Component Tests
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              with:
                  component: true

            - name: Upload Cypress screenshots on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
                  retention-days: 7

            - name: Upload Cypress videos on failure
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: cypress-videos
                  path: cypress/videos
                  retention-days: 7
