name: GitHub - Auto Label Pull Requests

# pull_request_target so Dependabot PRs get a token that can label; only the base branch is checked out
on:
    pull_request_target:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    add-labels:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout label config
              uses: actions/checkout@v4
              with:
                  sparse-checkout: .github

            - name: Apply type and area labels from .github/labels.json
              uses: actions/github-script@v9
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const { loadLabelConfig, typeFor, areasForFiles, diffManagedLabels } = await import(
                        `${process.env.GITHUB_WORKSPACE}/.github/scripts/labels.mjs`
                      )
                      const config = loadLabelConfig(process.env.GITHUB_WORKSPACE)
                      const { owner, repo } = context.repo
                      const pr = context.payload.pull_request

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        owner,
                        repo,
                        pull_number: pr.number,
                        per_page: 100,
                      })
                      const paths = files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean))

                      const type = typeFor(config, { title: pr.title, branch: pr.head.ref })
                      const wanted = [type, ...areasForFiles(config, paths)].filter(Boolean)
                      const current = pr.labels.map((label) => label.name)
                      const { add, remove } = diffManagedLabels(config, current, wanted)

                      if (add.length) {
                        await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: add })
                      }
                      for (const name of remove) {
                        await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name })
                      }
                      core.info(`#${pr.number}: type ${type || 'none'}; +[${add}] -[${remove}]`)
