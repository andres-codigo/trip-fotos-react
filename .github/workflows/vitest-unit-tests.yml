name: Vitest - Run Unit Tests
permissions:
    contents: read
    pull-requests: write

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'package.json'
            - 'vite.config.*'
            - '**/*.test.{js,jsx,ts,tsx}'
            - '**/*.spec.{js,jsx,ts,tsx}'
    pull_request:
        branches:
            - main
        # Docs and tooling-guidance changes cannot affect the app; workflow edits still run everything
        paths:
            - '**'
            - '!**/*.md'
            - '!.claude/**'
            - '!.devcontainer/**'
            - '!.vscode/**'
            - '!.github/**'
            - '.github/workflows/**'
            # The label config's tests live under .github/scripts
            - '.github/labels.json'
            - '.github/scripts/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Run Vitest Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # A version bump leaves its pinned allowScripts entry stale, and npm ci then silently skips that package's install script
            - name: Check allowScripts covers every install script
              run: |
                  pending=$(npm install-scripts ls 2>&1)
                  if grep -q 'not yet covered' <<< "$pending"; then
                      echo "$pending"
                      echo "::error::Run 'npm install-scripts approve <pkg>' for each package above and commit package.json"
                      exit 1
                  fi

            # Runs the whole suite once, with coverage
            - name: Run Vitest Unit Tests with Coverage
              run: npm run vitest:coverage -- --run
              timeout-minutes: 8

            - name: Upload Coverage Reports
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always()
              with:
                  name: coverage-reports-${{ github.run_number }}
                  path: coverage/
                  retention-days: 30
