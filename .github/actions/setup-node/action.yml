name: Set up Node and install dependencies
description: Node 24 with the npm cache, the Cypress binary cache (when Cypress is needed) and npm ci

inputs:
    cypress:
        description: Cache and download the Cypress binary
        default: 'true'

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
          with:
              node-version: '24'
              cache: 'npm'

        - name: Cache Cypress binary
          if: inputs.cypress == 'true'
          uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
          with:
              path: ~/.cache/Cypress
              key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

        - name: Install dependencies
          if: inputs.cypress == 'true'
          shell: bash
          run: npm ci

        # Vitest never runs Cypress, so skip its binary download
        - name: Install dependencies without the Cypress binary
          if: inputs.cypress != 'true'
          shell: bash
          run: npm ci
          env:
              CYPRESS_INSTALL_BINARY: '0'
