<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			name="robots"
			content="noindex" />
		<meta
			name="color-scheme"
			content="light dark" />
		<title>Page not found · Trip Fotos</title>
		<link
			rel="icon"
			href="/favicon.ico"
			sizes="48x48" />
		<link
			rel="icon"
			href="/icon.svg"
			type="image/svg+xml" />
		<style>
			:root {
				color-scheme: light dark;
				--bg: #faf9f5;
				--text: #1f1e1d;
				--border: #e3dfd3;
				--link: #9a3f22;
				--focus: #1d5fa8;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1f1e1d;
					--text: #f0eee6;
					--border: #3d3b37;
					--link: #e8967a;
					--focus: #7db4ee;
				}
			}
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				background: var(--bg);
				color: var(--text);
			}
			header {
				padding: 1.5rem 2rem;
				border-bottom: 1px solid var(--border);
			}
			header a {
				color: var(--text);
				font-family: 'Iowan Old Style', Georgia, serif;
				font-size: 1.625rem;
				font-weight: 500;
				text-decoration: none;
			}
			main {
				max-width: 40rem;
				margin: 3rem auto;
				padding: 0 1rem;
				text-align: center;
			}
			main a {
				color: var(--link);
			}
			a:focus-visible {
				outline: 3px solid var(--focus);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<header>
			<a href="/">Trip Fotos</a>
		</header>
		<main>
			<h1>This page is not available. Sorry about that.</h1>
			<p>
				Best return to the <a href="/">Trip Fotos home page</a> to get
				back on track.
			</p>
		</main>
	</body>
</html>
